<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-labelledby="title desc">
  <title id="title">Oliver's fixed refinement regions</title>
  <desc id="desc">A 64 cubed base and four nested regions. Each level halves cell spacing. The innermost cube has half-width 0.0625 and spacing 2 divided by 1024. Squares show region boundaries, not cells.</desc>
  <rect width="720" height="432" fill="#07111f"/>
  <g fill="#e9f1f5" font-family="Arial, Helvetica, sans-serif">
    <text x="46" y="40" font-size="20">Fixed core refinement</text>
    <text x="46" y="68" font-size="14" fill="#9fb3c2">Central x–z cross-section · full periodic box [−1, 1]³</text>
    <g fill="none" stroke-width="1.5">
      <rect x="56" y="102" width="272" height="272" stroke="#29445d"/>
      <rect x="124" y="170" width="136" height="136" stroke="#177eab"/>
      <rect x="158" y="204" width="68" height="68" stroke="#69d2e7"/>
      <rect x="175" y="221" width="34" height="34" stroke="#9cdae4"/>
      <rect x="183.5" y="229.5" width="17" height="17" stroke="#fff2c0"/>
    </g>
    <text x="190" y="396" font-size="16">x</text><text x="31" y="243" font-size="16">z</text>
    <text x="382" y="124" font-size="16">Level</text><text x="458" y="124" font-size="16">Half-width</text><text x="570" y="124" font-size="16">Spacing</text>
    <g font-size="15" fill="#9fb3c2">
      <text x="390" y="166">0</text><text x="478" y="166">1</text><text x="570" y="166">2 / 64</text>
      <text x="390" y="203">1</text><text x="478" y="203">0.5</text><text x="570" y="203">2 / 128</text>
      <text x="390" y="240">2</text><text x="478" y="240">0.25</text><text x="570" y="240">2 / 256</text>
      <text x="390" y="277">3</text><text x="478" y="277">0.125</text><text x="570" y="277">2 / 512</text>
      <text x="390" y="314">4</text><text x="478" y="314">0.0625</text><text x="570" y="314">2 / 1024</text>
    </g>
    <text x="382" y="366" font-size="14" fill="#69d2e7">1024³-equivalent core only.</text>
    <text x="382" y="391" font-size="14" fill="#9fb3c2">Region boundaries, not individual cells.</text>
  </g>
</svg>
