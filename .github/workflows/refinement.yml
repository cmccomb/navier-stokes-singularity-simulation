name: Refined-mesh operator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backends/amrex/**"
      - "scripts/refinement_pilot.py"
      - "scripts/diffusion_pilot.py"
      - "scripts/coupled_*.py"
      - "scripts/paper_run.py"
      - "scripts/threading_regression.py"
      - "scripts/archive_restriction_check.py"
      - "scripts/*_bridge.py"
      - "src/navier_stokes_sim/amrex_profile.py"
      - "src/navier_stokes_sim/profile.py"
      - "src/navier_stokes_sim/config.py"
      - "tests/test_refinement_pilot.py"
      - "tests/test_diffusion_pilot.py"
      - "tests/test_coupled_pilot.py"
      - "tests/test_paper_run.py"
      - "tests/test_threading_regression.py"
      - "tests/test_amrex_profile.py"
      - ".github/workflows/refinement.yml"
  pull_request:
    paths:
      - "backends/amrex/**"
      - "scripts/refinement_pilot.py"
      - "scripts/diffusion_pilot.py"
      - "scripts/coupled_*.py"
      - "scripts/paper_run.py"
      - "scripts/threading_regression.py"
      - "scripts/archive_restriction_check.py"
      - "scripts/*_bridge.py"
      - "src/navier_stokes_sim/amrex_profile.py"
      - "src/navier_stokes_sim/profile.py"
      - "src/navier_stokes_sim/config.py"
      - "tests/test_refinement_pilot.py"
      - "tests/test_diffusion_pilot.py"
      - "tests/test_coupled_pilot.py"
      - "tests/test_paper_run.py"
      - "tests/test_threading_regression.py"
      - "tests/test_amrex_profile.py"
      - ".github/workflows/refinement.yml"

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      OMP_THREAD_LIMIT: "2"
      OMP_DYNAMIC: "FALSE"
      OMP_MAX_ACTIVE_LEVELS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backends/amrex/requirements-build.txt
      - run: cmake -S backends/amrex -B build/amrex -DCMAKE_BUILD_TYPE=Release -DNS_ENABLE_OPENMP=ON
      - run: cmake --build build/amrex --parallel 2
      - run: ctest --test-dir build/amrex --output-on-failure
      - run: python -m scripts.refinement_pilot --levels 4 --output outputs/projection-ci
      - run: python -m scripts.diffusion_pilot --output outputs/diffusion-ci
      - run: python -m scripts.coupled_pilot --output outputs/coupled-ci
      - run: python -m pip install -e .
      - run: python -m navier_stokes_sim.amrex_profile --config backends/amrex/paper-reference.json --output outputs/paper-ci.tbl
      - run: python -m scripts.profile_bridge --table outputs/paper-ci.tbl --output outputs/profile-ci.json
      - run: python -m scripts.force_bridge --table outputs/paper-ci.tbl --output outputs/force-ci
      - run: python -m scripts.fine_force_bridge --table outputs/paper-ci.tbl --output outputs/fine-force-ci
      - run: python -m scripts.paper_run --table outputs/paper-ci.tbl --output outputs/paper-ci --base-n 16 --widths 0.5 --end 0.62 --max-dt 0.00025 --frame-dt 0.025 --timeout 600
      - run: python -m scripts.threading_regression --build build/amrex --table outputs/paper-ci.tbl --frame-phase-step 0.75 --output outputs/threading-ci
      - run: python -m scripts.archive_restriction_check --build build/amrex --output outputs/restriction-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projection-validation
          path: |
            outputs/projection-ci
            outputs/diffusion-ci
            outputs/coupled-ci
            outputs/profile-ci.json
            outputs/force-ci
            outputs/fine-force-ci
            outputs/paper-ci
            outputs/paper-ci.tbl*
            outputs/threading-ci
            outputs/restriction-ci
          if-no-files-found: ignore
