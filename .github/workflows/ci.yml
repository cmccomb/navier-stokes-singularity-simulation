name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-editable --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  native-explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv venv .venv-hf
      - run: uv pip install --python .venv-hf/bin/python -r spaces/native_explorer/requirements.txt pytest
      - run: .venv-hf/bin/python -m pytest tests/test_native_explorer.py tests/test_native_release.py tests/test_render_native_3d.py -q
